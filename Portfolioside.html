    <img src="kitty.jpg" alt="En tegning av hodet og skuldrene til en jente som lager en hjerteform med hendene ved å krysse tomlene. Hun har et kattetema og ble tegnet til en kunstkonkurranse." style="width: 285px;height: 250px;">
    <img src="blonde.jpg" alt="Tre ulike tegninger av samme figur i forskjellige positurer. To av tegningene er portretter, og én viser figuren fra livet og opp. På det ene portrettet holder hun en sag med inntørket blod, og på det andre lytter hun til musikk med lukkede øyne. På tegningen som viser henne fra livet og opp, står hun med hendene i siden. Figuren har en svært fargerik stil og blondt hår med blå tupper." style="width: 260px;height: 250px;">
    <img src="chibi.jpg" alt="Denne tegningen viser en figur i fullfigur i «chibi»-stil, chibi er for øvrig en egen stilart. Figuren er hovedsakelig lilla og har horn samt englevinger. Den inntar en slags svevende positur." style="width: 250px;height: 250px;">
